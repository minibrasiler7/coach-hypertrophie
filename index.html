<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coach Hypertrophie</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coach">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ECEDE8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Plan : une seule colonne, pensée pour le téléphone tenu d'une main à la salle.
     Un seul élément fort : la plaque jaune qui porte la charge. Le reste est calme. */
  --bg:#ECEDE8; --surface:#FFFFFF; --surface2:#F3F4F0; --ink:#15181D; --muted:#59626D; --line:#D3D6CE;
  --accent:#FFC629; --accent-ink:#17150A;
  --good:#1B7F45; --warn:#A85800; --bad:#C2352B;
  --fd:'Barlow Condensed','Arial Narrow','Helvetica Neue',sans-serif;
  --fb:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111317; --surface:#1A1D23; --surface2:#23272F; --ink:#F0F1EC; --muted:#9AA2AC; --line:#30353E;
    --good:#43C17C; --warn:#F0A63A; --bad:#F26A5F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111317; --surface:#1A1D23; --surface2:#23272F; --ink:#F0F1EC; --muted:#9AA2AC; --line:#30353E;
  --good:#43C17C; --warn:#F0A63A; --bad:#F26A5F; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--fb);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{max-width:520px;margin:0 auto;padding:16px 16px 96px;display:flex;flex-direction:column;gap:16px}
#app.v-workout{padding-bottom:40px}

/* ---- éléments communs ---- */
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.brand b{font:700 22px/1 var(--fd);letter-spacing:.04em;text-transform:uppercase}
.brand span{color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.eyebrow{font:600 13px/1.2 var(--fd);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.title{font:700 34px/1.02 var(--fd);letter-spacing:.005em;text-transform:uppercase}
.h2{font:700 22px/1.1 var(--fd);letter-spacing:.02em;text-transform:uppercase}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}
.num{font-variant-numeric:tabular-nums}
.btn{min-height:48px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font:700 20px/1 var(--fd);letter-spacing:.06em;text-transform:uppercase;min-height:58px}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:6px 12px;font-size:14px}
.link{background:none;border:0;padding:8px 0;text-decoration:underline;text-underline-offset:3px;font-weight:500;min-height:40px;text-align:left}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.pill.good{color:var(--good);border-color:var(--good)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
.pill.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ---- accueil ---- */
.exlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.exlist li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline}
.exlist li:first-child{border-top:0}
.exlist .n{font-weight:500}
.exlist .d{color:var(--muted);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.exlist li.off .n{text-decoration:line-through;color:var(--muted)}
.vol{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center;font-size:14px}
.vol .bar{height:10px;background:var(--surface2);border-radius:5px;position:relative;overflow:hidden}
.vol .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);border-radius:5px}
.vol .bar i.ok{background:var(--good)}
.vol .bar em{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--accent)}
.vol .v{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;white-space:nowrap}
.vol .v b{color:var(--ink)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:5}
.tabs div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{background:none;border:0;border-top:3px solid transparent;min-height:60px;padding:8px 2px 12px;font:600 15px/1 var(--fd);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tabs button.on{color:var(--ink);border-top-color:var(--accent)}

/* ---- séance ---- */
.wtop{display:flex;align-items:center;gap:8px}
.wtop .mid{flex:1;min-width:0;text-align:center}
.wtop .mid b{display:block;font:700 18px/1.1 var(--fd);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wtop .mid span{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.segs i.done{background:var(--ink)}
.segs i.cur{background:var(--accent)}
.segs i.skip{background:repeating-linear-gradient(90deg,var(--line) 0 4px,transparent 4px 8px)}
.banner{background:var(--surface);border:2px solid var(--accent);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.demo{position:relative;border-radius:var(--r);overflow:hidden;background:#000;aspect-ratio:3/2;border:0;padding:0;display:block;width:100%}
.demo .ph{position:absolute;inset:0;background-size:200% 100%;background-position:0 0;animation:flip 2.8s steps(1) infinite}
.demo.paused .ph{animation-play-state:paused}
.demo .lbl{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.66);color:#fff;font:600 13px/1 var(--fd);letter-spacing:.08em;text-transform:uppercase;padding:6px 9px;border-radius:6px}
@keyframes flip{0%{background-position:0 0}50%{background-position:100% 0}100%{background-position:100% 0}}
@media (prefers-reduced-motion: reduce){
  .demo{aspect-ratio:3/1}
  .demo .ph{animation:none;background-size:100% 100%}
}
.exname{font:700 30px/1.02 var(--fd);letter-spacing:.005em;text-transform:uppercase}
.plate{background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:14px 16px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:end;position:relative;overflow:hidden}
.plate::after{content:"";position:absolute;right:-70px;top:-70px;width:210px;height:210px;border-radius:50%;border:26px solid rgba(23,21,10,.07);box-shadow:inset 0 0 0 34px rgba(23,21,10,.05);pointer-events:none}
.plate .eyebrow{grid-column:1/-1;color:var(--accent-ink);opacity:.72}
.plate .load{font:700 76px/.86 var(--fd);letter-spacing:-.01em;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.plate .load.txt{font-size:40px;line-height:1}
.plate .load small{font:600 20px/1 var(--fd);letter-spacing:.04em;text-transform:uppercase}
.plate .unit{grid-column:1;font:600 14px/1.2 var(--fd);letter-spacing:.08em;text-transform:uppercase;opacity:.72;min-height:17px}
.plate .side{grid-row:2/4;grid-column:2;text-align:right;position:relative;z-index:1}
.plate .side b{display:block;font:700 40px/.9 var(--fd);font-variant-numeric:tabular-nums}
.plate .side span{display:block;font:600 14px/1.25 var(--fd);letter-spacing:.08em;text-transform:uppercase;opacity:.72}
.why{font-size:15px}
.note{font-size:14px;color:var(--muted);border-left:3px solid var(--accent);padding-left:10px}
.note.alert{border-left-color:var(--bad);color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.setchip{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;min-height:40px}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stp{display:flex;flex-direction:column;gap:6px}
.stp label{font:600 13px/1.2 var(--fd);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.stp div{display:grid;grid-template-columns:48px 1fr 48px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.stp button{border:0;background:var(--surface2);font:700 26px/1 var(--fd);min-height:56px}
.stp input{border:0;background:transparent;text-align:center;font:700 30px/1 var(--fd);width:100%;min-width:0;font-variant-numeric:tabular-nums;padding:0}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;border-left:1px solid var(--line);background:transparent;min-height:46px;font-weight:600;padding:6px 4px}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--ink);color:var(--bg)}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font:600 13px/1.2 var(--fd);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts .btn{font-size:15px;padding:8px 10px}
.cues{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.rest{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.rest .eyebrow{color:inherit;opacity:.7}
.rest .t{font:700 84px/.82 var(--fd);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.rest .bar{height:8px;border-radius:4px;background:rgba(127,127,127,.35);overflow:hidden}
.rest .bar i{display:block;height:100%;background:var(--accent);width:0}
.rest .btn{background:transparent;color:inherit;border-color:rgba(127,127,127,.6)}
.rest .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rest .tip{font-size:15px;opacity:.9}
.queue{list-style:none;margin:0;padding:0}
.queue li{border-top:1px solid var(--line)}
.queue li:first-child{border-top:0}
.queue button{width:100%;background:none;border:0;display:flex;justify-content:space-between;gap:12px;padding:11px 0;text-align:left;align-items:baseline;min-height:44px}
.queue .d{color:var(--muted);font-size:14px;white-space:nowrap}

/* ---- rapport, progrès ---- */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface2);border-radius:10px;padding:10px 8px;text-align:center}
.tile b{display:block;font:700 28px/1 var(--fd);font-variant-numeric:tabular-nums}
.tile span{font:600 12px/1.2 var(--fd);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rrow{border-top:1px solid var(--line);padding:11px 0;display:flex;flex-direction:column;gap:5px}
.rrow:first-child{border-top:0;padding-top:0}
.rrow .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.rrow .hd b{font-weight:600}
.rrow .sets{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.list li{padding-left:16px;position:relative}
.list li::before{content:"";position:absolute;left:0;top:.62em;width:7px;height:2px;background:var(--ink)}
.sess{width:100%;background:none;border:0;border-top:1px solid var(--line);padding:12px 0;display:flex;justify-content:space-between;gap:12px;text-align:left;align-items:center;min-height:52px}
.sess:first-of-type{border-top:0}
.sess small{display:block;color:var(--muted);font-size:14px}
.chart{width:100%;height:auto;display:block}
.chart text{font:500 11px var(--fb);fill:var(--muted)}
select,.inp{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:8px 12px;width:100%;font-size:16px}
textarea.inp{min-height:110px;font-size:14px;font-family:ui-monospace,Menlo,monospace}
.sci .k{font:700 22px/1.08 var(--fd);letter-spacing:.01em;text-transform:uppercase}
.sci .app{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:15px}
.sci .src{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.set-row{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid var(--line);padding:10px 0}
.set-row:first-of-type{border-top:0}
.sw{min-width:92px}

/* ---- feuilles et messages ---- */
#sheet{position:fixed;inset:0;z-index:20;display:none}
#sheet.on{display:block}
#sheet .bg{position:absolute;inset:0;background:rgba(0,0,0,.55)}
#sheet .box{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:18px 16px 28px;display:flex;flex-direction:column;gap:12px;max-width:520px;margin:0 auto}
.zone{display:grid;grid-template-columns:1fr 210px;gap:10px;align-items:center}
.alt{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-height:52px}
.alt[disabled]{opacity:.55}
.alt.cur{border-color:var(--ink);border-width:2px}
#toast{position:fixed;left:16px;right:16px;bottom:78px;z-index:30;display:none;justify-content:center;pointer-events:none}
#toast.on{display:flex}
#toast div{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;max-width:488px;font-weight:500;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.v-workout~#toast{bottom:20px}
@media (max-width:360px){
  .plate .load{font-size:62px}
  .zone{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(2,1fr)}
}

</style>
</head>
<body>
<main id="app"></main>
<div id="sheet"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* ===== Données : muscles, zones, exercices, programme, conseils, sources ===== */
const MUSCLES = {pecs:'Pectoraux', dos:'Dos', epaules:'Épaules', biceps:'Biceps', triceps:'Triceps',
  quads:'Quadriceps', ischios:'Ischio-jambiers', fessiers:'Fessiers', mollets:'Mollets', abdos:'Abdominaux'};
const ZONES = {ep:'Épaule', co:'Coude', po:'Poignet', nu:'Nuque', do:'Bas du dos', ha:'Hanche', ge:'Genou', ch:'Cheville / pied'};
const EQ = {machine:'Machine', cable:'Poulie', dumbbell:'Haltères', barbell:'Barre', smith:'Barre guidée', body:'Poids du corps'};
const GENERIC_ST = {dumbbell:1, barbell:1, cable:1, body:1, ezbar:1};

/* X(id, nom, muscle principal, muscles secondaires (0,5 série), créneau, poste, matériel,
     type c=polyarticulaire i=isolation, pas de charge, sollicitation articulaire 0-3, photo, consignes, options) */
const EX = [];
function X(id,n,m,s,slot,st,eq,t,inc,j,img,cues,o){ EX.push(Object.assign({id:id,n:n,m:m,s:s,slot:slot,st:st,eq:eq,t:t,inc:inc,j:j,img:img,cues:cues},o||{})); }

// ---------- Pectoraux
X('dc_halt','Développé couché haltères','pecs',['triceps','epaules'],'press_h','dumbbell','dumbbell','c',2,{ep:2,co:1,po:1},'Dumbbell_Bench_Press',
  ['Allongé, pieds au sol, omoplates serrées.','Descends les haltères au niveau de la poitrine, coudes à 45°.','Pousse sans décoller les épaules du banc.'],{per:1,start:14});
X('chest_press','Chest press machine','pecs',['triceps','epaules'],'press_h','chestpress','machine','c',5,{ep:1,co:1,po:1},'Machine_Bench_Press',
  ['Règle le siège : poignées à hauteur de poitrine.','Pousse sans verrouiller les coudes, reviens lentement.','Garde les omoplates collées au dossier.'],{start:30});
X('dc_barre','Développé couché barre','pecs',['triceps','epaules'],'press_h','benchbar','barbell','c',2.5,{ep:3,co:2,po:2},'Barbell_Bench_Press_-_Medium_Grip',
  ['Yeux sous la barre, omoplates serrées, pieds ancrés.','Descends la barre sur le bas de la poitrine.','Poignets droits, coudes à 45° du buste.'],{start:40});
X('dc_smith','Développé couché barre guidée','pecs',['triceps','epaules'],'press_h','smith','smith','c',2.5,{ep:2,co:1,po:2},'Smith_Machine_Bench_Press',
  ['Banc centré sous la barre guidée.','Descends sur le milieu de la poitrine, pousse droit.','Omoplates serrées pendant toute la série.'],{start:30});
X('pompes','Pompes','pecs',['triceps','epaules'],'press_h','body','body','c',2.5,{ep:1,co:1,po:2},'Pushups',
  ['Mains un peu plus larges que les épaules, corps gainé.','Descends la poitrine près du sol, repousse.','Ne creuse pas le bas du dos.'],{bw:1,noload:1});
X('di_halt','Développé incliné haltères','pecs',['triceps','epaules'],'press_incline','dumbbell','dumbbell','c',2,{ep:2,co:1,po:1},'Incline_Dumbbell_Press',
  ['Banc incliné à 30°, omoplates serrées.','Descends les haltères sur le haut de la poitrine.','Pousse vers le haut, pas vers l\'avant.'],{per:1,start:12});
X('di_machine','Développé incliné machine','pecs',['triceps','epaules'],'press_incline','inclinepress','machine','c',5,{ep:1,co:1,po:1},'Leverage_Incline_Chest_Press',
  ['Règle le siège : poignées au niveau du haut de la poitrine.','Pousse, puis reviens lentement jusqu\'à l\'étirement.','Dos et tête contre le dossier.'],{start:25});
X('di_smith','Développé incliné barre guidée','pecs',['triceps','epaules'],'press_incline','smith','smith','c',2.5,{ep:2,co:1,po:2},'Smith_Machine_Incline_Bench_Press',
  ['Banc incliné à 30° sous la barre guidée.','Descends sur le haut de la poitrine.','Coudes sous la barre, poignets droits.'],{start:25});
X('di_barre','Développé incliné barre','pecs',['triceps','epaules'],'press_incline','inclinebar','barbell','c',2.5,{ep:3,co:2,po:2},'Barbell_Incline_Bench_Press_-_Medium_Grip',
  ['Banc incliné à 30°, prise un peu plus large que les épaules.','Descends la barre sous les clavicules.','Garde les fesses sur le banc.'],{start:30});
X('pecdeck','Pec deck (butterfly)','pecs',[],'fly','pecdeck','machine','i',5,{ep:2},'Butterfly',
  ['Siège réglé : coudes à hauteur d\'épaules.','Ramène les bras devant toi, serre une seconde.','Reviens lentement jusqu\'à sentir l\'étirement des pectoraux.'],{start:25,say:'Pec deck'});
X('ecarte_poulie','Écarté à la poulie vis-à-vis','pecs',[],'fly','cable','cable','i',2.5,{ep:2,co:1},'Cable_Crossover',
  ['Poulies hautes, un pied devant, buste légèrement penché.','Ramène les mains devant toi, coudes légèrement fléchis.','Laisse les bras s\'ouvrir lentement au retour.'],{per:1,start:10});
X('ecarte_poulie_basse','Écarté poulie basse','pecs',[],'fly','cable','cable','i',2.5,{ep:1,co:1},'Low_Cable_Crossover',
  ['Poulies en bas, un pied devant.','Monte les mains devant la poitrine, de bas en haut.','Garde les coudes légèrement fléchis.'],{per:1,start:7.5});
X('ecarte_halt','Écarté haltères','pecs',[],'fly','dumbbell','dumbbell','i',1,{ep:3,co:1,po:1},'Dumbbell_Flyes',
  ['Allongé, haltères au-dessus de la poitrine, coudes souples.','Ouvre les bras en arc de cercle jusqu\'à l\'étirement.','Ne descends pas plus bas que les épaules.'],{per:1,start:8});

/* ===== Logique : état, choix d'exercice, charge conseillée, volume, rapport ===== */
function defaultState(){
  return {v:1, updatedAt:0,
    profile:{days:4, dur:60, bw:null},
    settings:{voice:true, talk:'normal', vox:'f', vol:1, restC:150, restI:90},
    unavail:{}, pain:{}, prefs:{}, incs:{}, rot:0, cur:null, sessions:[], deleted:{}};
}
function r2(x){ return Math.round(x*100)/100; }
function floorTo(x, inc){ return r2(Math.floor(x/inc + 1e-9)*inc); }
function incOf(S, ex){ return (S.incs && S.incs[ex.id]) || ex.inc; }
function effW(S, ex, w){ return ex.bw ? ((S.profile.bw||75) + (w||0)) : (w||0); }
function e1rm(w, r){ return w*(1 + r/30); }
function fmtKg(w){ return String(r2(w)).replace('.', ','); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function cycle(S){ return CYCLES[S.profile.days] || CYCLES[4]; }
function todayTpl(S){ var c=cycle(S); return c[((S.rot%c.length)+c.length)%c.length]; }
function weekStart(ts){ var d=new Date(ts); d.setHours(0,0,0,0); var wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return d.getTime(); }
function hasPain(pain){ for(var k in pain) if(pain[k]>0) return true; return false; }

/* ---------- Historique d'un exercice ---------- */
function exHistory(S, exId){
  var out=[];
  S.sessions.forEach(function(se){
    se.items.forEach(function(it){
      if(it.exId!==exId) return;
      var sets=it.sets.filter(function(s){return s.r>0;});
      if(sets.length) out.push({t:se.start, sets:sets, light:!!it.light, sid:se.id});
    });
  });
  out.sort(function(a,b){return a.t-b.t;});
  return out;
}
function bestSet(S, ex, sets){
  var b=null, be=-1;
  sets.forEach(function(s){ var e=e1rm(effW(S,ex,s.w), s.r); if(e>be){ be=e; b=s; } });
  return b ? {set:b, e1:be} : null;
}

/* Score d'une séance sur un exercice : 1RM estimé moyen sur les n premières séries.
   Il monte aussi quand les dernières séries gagnent des répétitions. */
function sessScore(S, ex, sets, n){
  var t=0, k=Math.min(n, sets.length), i;
  for(i=0;i<k;i++) t+=e1rm(effW(S,ex,sets[i].w), sets[i].r);
  return k ? t/k : 0;
}

/* ---------- Plan de séance ---------- */
function planFor(S, tplId){
  var tpl=TPL[tplId], dur=S.profile.dur||60;
  return tpl.items.map(function(it,i){
    var sets=it.sets;
    if(dur<=45) sets=Math.max(2, sets-1);
    else if(dur>=75 && i<3) sets=sets+1;
    if(S.profile.days<=2 && i<5) sets=sets+1;
    return {key:tplId+'|'+i, slot:it.slot, sets:sets, lo:it.reps[0], hi:it.reps[1], pref:it.pref||null};
  });
}
function restFor(S, ex){ return ex.t==='c' ? (S.settings.restC||150) : (S.settings.restI||90); }
function estMinutes(S, items){
  var t=0;
  items.forEach(function(it){ var ex=EXI[it.exId]; if(!ex || it.state==='skip') return; t += it.tg.sets*(45+restFor(S,ex)) + 60; });
  return Math.max(5, Math.round(t/300)*5);
}

/* ---------- Disponibilité et douleur ---------- */
function unavailKey(ex){ return GENERIC_ST[ex.st] ? 'ex:'+ex.id : 'st:'+ex.st; }
function isAvail(S, ex){ return !S.unavail['ex:'+ex.id] && !(!GENERIC_ST[ex.st] && S.unavail['st:'+ex.st]); }
function stressOf(ex, pain){ var m=0; for(var k in pain){ if(pain[k]>0) m=Math.max(m, ex.j[k]||0); } return m; }
function painLevelFor(ex, pain){ var m=0; for(var k in pain){ if(pain[k]>0 && (ex.j[k]||0)>=2) m=Math.max(m, pain[k]); } return m; }
function painZonesFor(ex, pain){ var a=[]; for(var k in pain){ if(pain[k]>0 && (ex.j[k]||0)>=2) a.push(k); } return a; }

function candList(S, p){
  var saved=S.prefs && S.prefs[p.key], list=SLOTS[p.slot].slice();
  if(saved && !(EXI[saved] && (EXI[saved].slot===p.slot || (FALLBACK[p.slot]||[]).indexOf(EXI[saved].slot)>=0))) saved=null;
  var pref=saved || p.pref;
  if(pref && EXI[pref]) list=[pref].concat(list.filter(function(x){return x!==pref;}));
  return list.map(function(id){return EXI[id];});
}
/* Choisit l'exercice d'un créneau.
   ctx.pain    : zones douloureuses {zone: 1 gêne | 2 douleur}
   ctx.used    : exercices déjà pris dans la séance
   ctx.exclude : exercices à écarter
   ctx.avoidSt : postes occupés, proposés en dernier */
function pickExercise(S, p, ctx){
  ctx=ctx||{};
  var pain=ctx.pain||{}, used=ctx.used||{}, excl=ctx.exclude||{}, avoid=ctx.avoidSt||{};
  function ok(e){ return isAvail(S,e) && !used[e.id] && !excl[e.id]; }
  function order(a){ return a.filter(function(e){return !avoid[e.st];}).concat(a.filter(function(e){return avoid[e.st];})); }

  (FALLBACK[p.slot]||[]).forEach(function(sl){ SLOTS[sl].forEach(function(id){ var e=EXI[id]; if(ok(e)) fb.push(e); }); });
  fb=order(fb);
  var first=list[0]||null;
  if(!hasPain(pain)){
    if(first) return {ex:first, light:false, why:null};
    if(fb[0]) return {ex:fb[0], light:false, why:'cross'};
    return null;
  }
  var soft=list.filter(function(e){return stressOf(e,pain)<=1;});
  if(soft.length) return {ex:soft[0], light:false, why: soft[0]===first ? null : 'pain'};
  var soft2=fb.filter(function(e){return stressOf(e,pain)<=1;});
  if(soft2.length) return {ex:soft2[0], light:false, why:'pain'};
  if(!list.length) return null;
  var best=list.slice().sort(function(a,b){return stressOf(a,pain)-stressOf(b,pain);})[0];
  if(painLevelFor(best,pain)>=2 || stressOf(best,pain)>=3) return {ex:null, skip:true, why:'pain', would:best};

function alternatives(S, cur, it){

  }
  candList(S, planItemOf(cur,it)).forEach(function(e){ push(e,false); });
  (FALLBACK[it.slot]||[]).forEach(function(sl){ SLOTS[sl].forEach(function(id){ push(EXI[id], true); }); });
  return out;

/* Affecte un exercice à une ligne de séance. Certains exercices ont leur propre fourchette de répétitions. */

  var e=EXI[exId], b=it.base || {lo:it.tg.lo, hi:it.tg.hi};
  it.base=b; it.exId=exId;
  it.tg.lo=(e && e.reps) ? e.reps[0] : b.lo;
  it.tg.hi=(e && e.reps) ? e.reps[1] : b.hi;

/* ---------- Construction et déroulé de la séance ---------- */

  var plan=planFor(S,tplId), used={}, items=[];

    var base=pickExercise(S,p,{used:used});
    var pk=pickExercise(S,p,{used:used, pain:S.pain});
    var it={key:p.key, slot:p.slot, tg:{sets:p.sets, lo:p.lo, hi:p.hi}, sets:[], state:'todo', deferred:0,

    if(!pk || !pk.ex){
      it.state='skip'; setEx(it, (base&&base.ex)?base.ex.id:SLOTS[p.slot][0]); it.swap=(pk&&pk.skip)?'painskip':'none';
    } else {

      used[pk.ex.id]=1;

function curItem(cur){ return cur.items[cur.order[cur.pos]]; }

}

/* Passe à l'exercice suivant à faire. Renvoie false quand la séance est finie. */
function advance(cur){

function logSet(S, set, now){

  it.sets.push({w:set.w, r:set.r, rir:(set.rir==null?null:set.rir), t:now});
  var finished=it.sets.length>=it.tg.sets;
  if(finished) it.state='done';

/* Machine occupée : on fait d'abord l'exercice suivant, puis on revient. Deuxième fois : remplacement pour aujourd'hui. */
function actBusy(S){

  for(p=cur.pos+1;p<cur.order.length;p++){ if(cur.items[cur.order[p]].state==='todo'){ other=p; break; } }
  if(it.deferred===0 && other>=0){
    it.deferred=1;
    var otherIdx=cur.order[other];
    cur.order.splice(other,1); cur.order.splice(cur.pos,1);
    cur.order.splice(cur.pos,0,otherIdx,idx);
    return {type:'defer', it:it, next:cur.items[otherIdx]};
  }
  var ex=EXI[it.exId], avoid={}, ex0={}; avoid[ex.st]=1; ex0[it.exId]=1;
  var pk=pickExercise(S, planItemOf(cur,it), {used:usedMap(cur,idx), pain:cur.pain, exclude:ex0, avoidSt:avoid});
  if(pk && pk.ex){ setEx(it, pk.ex.id); it.light=!!pk.light; it.swap='busy'; it.deferred=2; return {type:'replace', old:ex, ex:pk.ex}; }

/* Machine absente de la salle : on la retient et on remplace partout dans la séance. */
function actAbsent(S){

  S.unavail[unavailKey(ex)]=1;
  cur.items.forEach(function(x,i){
    if(x.state!=='todo' || x.sets.length) return;
    var e=EXI[x.exId]; if(isAvail(S,e)) return;
    var pk=pickExercise(S, planItemOf(cur,x), {used:usedMap(cur,i), pain:cur.pain});
    if(pk && pk.ex){ setEx(x, pk.ex.id); x.planId=pk.ex.id; x.light=!!pk.light; x.swap='absent'; changes.push({old:e, ex:pk.ex, current:i===idx}); }

/* Douleur : on remplace les exercices qui chargent la zone, sinon version douce, sinon on passe. */
function actPain(S, pain){

  var se={id:cur.id, tplId:cur.tplId, name:cur.name, start:cur.start, end:now, pain:cur.pain,
    items:cur.items.map(function(it){

    })};

/* ---------- Charge conseillée ---------- */
function recommend(S, ex, tg, light, now){
  var inc=incOf(S,ex), H=exHistory(S,ex.id);
  var Hn=H.filter(function(e){return !e.light;}), Hl=H.filter(function(e){return e.light;});
  var lo=tg.lo, hi=tg.hi, i;
  if(light){ lo=15; hi=20; }
  var out={w:null, lo:lo, hi:hi, per:[], kind:'first', msg:'', last:null, plateau:false, inc:inc, e1:null};
  function refOf(entry){
    var b=bestSet(S,ex,entry.sets);
    var R=entry.sets.filter(function(s){return s.w===b.set.w;}).map(function(s){return s.r;});
    return {w:b.set.w, e1:b.e1, R:R};
  }
  var src=light ? Hl : Hn, rf;
  if(!src.length){
    if(light && Hn.length){
      rf=refOf(Hn[Hn.length-1]);
      out.w=ex.bw ? 0 : Math.max(inc, floorTo(rf.w*0.7, inc)); out.kind='light';
      out.msg='Version douce : charge réduite de 30 %, '+lo+' à '+hi+' répétitions, descente en 3 secondes.';
    } else {
      out.w=ex.bw ? 0 : (ex.start||20);
      if(light && !ex.bw) out.w=Math.max(inc, floorTo(out.w*0.7, inc));
      out.msg=ex.bw ? 'Première fois sur cet exercice. Arrête-toi 2 répétitions avant l\'échec. Je m\'en sers pour la suite.'
                    : 'Première fois sur cet exercice. Règle la charge pour faire '+hi+' répétitions en gardant 2 en réserve. Je m\'en sers pour la suite.';
    }
    return out;
  }
  var last=src[src.length-1]; rf=refOf(last);
  var R=rf.R, days=(now-last.t)/86400000, lastRir=last.sets[last.sets.length-1].rir;
  out.last={t:last.t, sets:last.sets, w:rf.w, R:R}; out.e1=rf.e1;
  if(days>21 && !ex.bw){
    out.w=Math.max(inc, floorTo(rf.w*0.9, inc)); out.kind='return';
    out.msg='Reprise après '+Math.round(days)+' jours sans cet exercice : charge réduite de 10 %.';
  } else if(R.length>=Math.min(2,tg.sets) && R.every(function(r){return r>=hi;})){
    if(ex.noload){
      out.w=rf.w; out.kind='hold';
      out.msg='Tu fais '+hi+' répétitions sur toutes les séries. Ralentis la descente à 3 secondes ou ajoute une série.';
    } else {
      var step=(lastRir!=null && lastRir>=3) ? 2*inc : inc;
      out.w=r2(rf.w+step); out.kind='up';
      out.msg='La dernière fois : '+R.join(', ')+' répétitions à '+fmtKg(rf.w)+' kg. Haut de la fourchette atteint, on monte.';
    }
  } else if(R[0]<lo && !(ex.bw && rf.w<=0)){
    var target=ex.bw ? r2(rf.w-inc) : floorTo(rf.e1/(1+(lo+1)/30), inc);
    out.w=Math.max(ex.bw?0:inc, Math.min(r2(rf.w-inc), target)); out.kind='down';
    out.msg=R[0]+' répétitions la dernière fois à '+fmtKg(rf.w)+' kg : trop lourd pour '+lo+'–'+hi+'. On descend.';
  } else {
    out.w=rf.w; out.kind='hold';
    out.msg='Même charge. La dernière fois : '+R.join(', ')+' répétitions. Vise une de plus.';
    for(i=0;i<tg.sets;i++){
      if(R[i]==null) break;
      out.per[i]=Math.max(lo, Math.min(hi, R[i]+1));
    }
  }

    var l3=Hn.slice(-3), nn=Math.min(l3[0].sets.length, l3[1].sets.length, l3[2].sets.length);
    var a=l3.map(function(e){return sessScore(S,ex,e.sets,nn);});
    if(a[2]<=a[0]*1.005 && a[1]<=a[0]*1.005) out.plateau=true;
  }
  return out;
}
function warmups(S, ex, w){
  if(ex.t!=='c' || ex.bw || !w) return [];
  var inc=incOf(S,ex);
  return [{w:Math.max(inc,floorTo(w*0.5,inc)), r:8},{w:Math.max(inc,floorTo(w*0.75,inc)), r:4}].filter(function(x){return x.w<w;});

/* Charge et répétitions visées pour la prochaine série, selon les séries déjà faites */
function setAdvice(S, ex, rec, done){
  var inc=rec.inc, lo=rec.lo, hi=rec.hi, n=done.length, r;
  if(!n){
    if(rec.per[0]) r=rec.per[0];
    else if(rec.kind==='first') r=hi;
    else if(rec.kind==='up' && rec.e1 && effW(S,ex,rec.w)>0) r=Math.max(lo, Math.min(hi, Math.round(30*(rec.e1/effW(S,ex,rec.w)-1))));
    else r=Math.round((lo+hi)/2);
    return {w:rec.w, r:r, note:''};
  }
  var last=done[n-1], w=last.w, note='';
  if(last.r<lo && !(ex.bw && w<=0)){
    var k=(lo-last.r>=3) ? 2 : 1;
    w=Math.max(ex.bw?0:inc, r2(w-k*inc));
    note='Sous la fourchette : baisse à '+fmtKg(w)+' kg.';
  } else if(last.r>hi && (last.rir==null || last.rir>=2) && !ex.noload){
    w=r2(w+inc); note='Trop facile : monte à '+fmtKg(w)+' kg.';
  }
  if(w<last.w) r=Math.max(lo, Math.min(hi, last.r+2));
  else if(w>last.w) r=Math.max(lo, hi-2);
  else if(w===rec.w && rec.per[n]) r=rec.per[n];
  else r=Math.max(lo, Math.min(hi, last.r-1));
  return {w:w, r:r, note:note};

/* ---------- Volume hebdomadaire (méthode fractionnelle : muscle aidant = 0,5 série) ---------- */
function setCredit(ex){
  var c={}; c[ex.m]=1;
  (ex.full||[]).forEach(function(m){ c[m]=1; });
  (ex.s||[]).forEach(function(m){ if(!c[m]) c[m]=0.5; });
  return c;
}
function volumeOf(items){
  var v={};
  items.forEach(function(it){
    var ex=EXI[it.exId]; if(!ex) return;
    var n=it.sets.filter(function(s){return s.r>0;}).length; if(!n) return;
    var c=setCredit(ex); for(var m in c) v[m]=(v[m]||0)+n*c[m];

  return v;
}
function volumeWeek(S, now, extraItems){
  var ws=weekStart(now), v={};
  function add(o){ for(var m in o) v[m]=(v[m]||0)+o[m]; }
  S.sessions.forEach(function(se){ if(se.start>=ws && se.start<ws+7*864e5) add(volumeOf(se.items)); });
  if(extraItems) add(volumeOf(extraItems));

}

  var v={};

    var used={};
    planFor(S,tplId).forEach(function(p){
      var pk=pickExercise(S,p,{used:used}); if(!pk || !pk.ex) return;
      used[pk.ex.id]=1;
      var c=setCredit(pk.ex); for(var m in c) v[m]=(v[m]||0)+p.sets*c[m];

/* ---------- Rapport de fin de séance ---------- */
function buildReport(S, se){

  var rows=[], nSets=0, nReps=0, ton=0, rirSum=0, rirN=0, prs=0, up=0, down=0, same=0, cmp=0, heavy=[], nEx=0;

        if(!it.light && b.e1>allBest*1.001){ row.pr=true; prs++; }
      } else row.status='new';
      var lo=it.light ? 15 : it.tg.lo;
      var loaded=sets.some(function(s){return s.w>0;});
      if((!ex.bw || loaded) && sets.filter(function(s){return s.r<lo;}).length>=2) heavy.push(ex.n);
    }

  else if(up/cmp>=0.6){ verdict='Séance en progrès'; com.push(up+' exercice'+(up>1?'s':'')+' sur '+cmp+' en hausse par rapport à la dernière fois.'); }
  else if(down/cmp>=0.5){ verdict='Séance en retrait'; com.push(down+' exercice'+(down>1?'s':'')+' sur '+cmp+' en baisse. Regarde ton sommeil et ton alimentation. Si cela se répète à la prochaine séance, allège de 10 % pendant une semaine.'); }
  else { verdict='Séance stable'; com.push(up+' en hausse, '+same+' stable'+(same>1?'s':'')+', '+down+' en baisse. Vise une répétition de plus par exercice la prochaine fois.'); }
  if(prs) com.push(prs+' record'+(prs>1?'s':'')+' battu'+(prs>1?'s':'')+' aujourd\'hui.');
  if(avgRir!=null && avgRir>=2.6) com.push('Tu gardes en moyenne '+fmtKg(Math.round(avgRir*10)/10)+' répétitions en réserve. Pour grossir, termine tes séries à 1 ou 2 répétitions de l\'échec.');
  if(avgRir!=null && rirN>=6 && avgRir<=0.4) com.push('Tu vas à l\'échec sur presque toutes les séries. Garde 1 à 2 répétitions en réserve sur les gros exercices : même gain, moins de fatigue.');

  if(zones.length) com.push('Zone sensible aujourd\'hui : '+zones.join(', ')+'. Si la douleur dépasse 5 sur 10 ou dure encore demain matin, allège la prochaine séance. Si elle dure plusieurs jours, consulte un médecin ou un physiothérapeute.');
  if(S.profile.bw) com.push('Protéines : vise environ '+Math.round(S.profile.bw*1.6)+' g par jour (1,6 g par kilo).');
  var skipped=se.items.filter(function(it){return !it.sets.length;}).map(function(it){return EXI[it.exId]?EXI[it.exId].n:'';});
  return {id:se.id, name:se.name, start:se.start, end:se.end, durMin:Math.max(1,Math.round((se.end-se.start)/60000)),
    nEx:nEx, nSets:nSets, nReps:nReps, ton:Math.round(ton), avgRir:avgRir, prs:prs, up:up, down:down, same:same, cmp:cmp,

function setLabel(row, s){

function reportText(rep, nextName){
  var d=new Date(rep.start), L=[];
  L.push('RAPPORT DE SÉANCE — '+rep.name);
  L.push(d.toLocaleDateString('fr-CH',{weekday:'long', day:'numeric', month:'long', year:'numeric'})+' · '+rep.durMin+' min');
  L.push(rep.verdict+' · '+rep.nSets+' séries · '+rep.nReps+' répétitions · '+rep.ton+' kg soulevés'+(rep.prs?' · '+rep.prs+' record(s)':''));
  L.push('');
  rep.rows.forEach(function(r){
    if(!r.sets.length) return;
    var s=r.sets.map(function(x){return setLabel(r,x);}).join(' | ');
    var t=r.status==='up'?'en hausse':r.status==='down'?'en baisse':r.status==='same'?'stable':'référence';
    if(r.delta!=null) t+=' ('+(r.delta>=0?'+':'')+fmtKg(Math.round(r.delta*10)/10)+' %)';
    L.push('• '+r.name+(r.light?' (version douce)':'')+' : '+s+' — '+t+(r.pr?' — RECORD':''));
  });
  if(rep.skipped.length){ L.push(''); L.push('Non faits : '+rep.skipped.join(', ')); }
  L.push('');
  rep.comments.forEach(function(c){ L.push('- '+c); });
  if(nextName){ L.push(''); L.push('Prochaine séance : '+nextName); }
  return L.join('\n');
}

  init:function(){

    Promise.all([c.use('db'), c.use('user')]).then(function(r){
      var db=r[0], user=r[1]; if(!db || !user) return null;
      return Promise.resolve(user.id()).then(function(uid){
        if(!uid) return null;

  },
  merge:function(snap){
    var remoteMeta=null, remote={}, local={}, id, self=this;
    snap.docs.forEach(function(d){ var x=d.data(); if(!x) return; if(d.id==='meta') remoteMeta=x; else if(d.id.indexOf('s_')===0 && x.id) remote[x.id]=x; });

    var deleted=Object.assign({}, (remoteMeta && remoteMeta.deleted)||{}, S.deleted||{});
    for(id in remote){ if(!local[id] && !deleted[id]) S.sessions.push(clone(remote[id])); }
    for(id in local){ if(!remote[id] && !deleted[id]) (function(se){ self.write('s_'+se.id, function(){ return se; }); })(local[id]); }
    for(id in deleted){ if(remote[id]) self.remove('s_'+id); }
    S.sessions=S.sessions.filter(function(s){ return !deleted[s.id]; }).sort(function(a,b){ return a.start-b.start; });
    S.deleted=deleted;
    if(remoteMeta && (remoteMeta.updatedAt||0)>(S.updatedAt||0)){
      var keepSessions=S.sessions, m=clone(remoteMeta);
      S=normalize(Object.assign(m, {sessions:keepSessions, deleted:deleted}));

      if(!S.cur && view==='workout') view='home';
    } else if((S.updatedAt||0)>0) this.metaSoon();
  },
  push:function(what, arg){
    if(!this.ready) return;
    if(what==='session' && arg) this.write('s_'+arg.id, function(){ return arg; });
    if(what==='delete' && arg) this.remove('s_'+arg);
    this.metaSoon();
  },
  metaSoon:function(){ var self=this; clearTimeout(this.timer); this.timer=setTimeout(function(){ self.write('meta', metaDoc); }, 1500); },
  write:function(id, fn){
    var self=this, data;
    if(!this.col) return;
    if(this.busy[id]){ this.dirty[id]=fn; return; }
    try{ data=clone(fn()); }catch(e){ return; }
    this.busy[id]=true;
    this.col.doc(id).set(data).then(function(){ ui.sync='cloud'; }, function(){ ui.sync='error'; }).then(function(){
      self.busy[id]=false;
      if(self.dirty[id]){ var f=self.dirty[id]; delete self.dirty[id]; self.write(id, f); }
    });
  },
  remove:function(id){ try{ if(this.col) this.col.doc(id).delete().catch(function(){}); }catch(e){} }
};

var CACHE='coach-v2';

function applyAudio(){ try{ if(navigator.audioSession && navigator.audioSession.type!=='ambient') navigator.audioSession.type='ambient'; }catch(e){} }

function isInstalled(){ try{ return !!(navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)); }catch(e){ return false; } }

var Snd={ctx:null, out:null, index:null, indexDir:null, indexP:null, packs:{}, bufs:{}, queue:[], src:null, gen:0, tail:null, log:[],
  supported:function(){ return !!(window.AudioContext || window.webkitAudioContext); },
  dir:function(){ return 'snd/'+(S.settings.vox==='m'?'m':'f')+'/'; },
  /* À appeler pendant un geste de l'utilisateur : le téléphone n'autorise le son qu'à ce moment-là. */
  unlock:function(){
    if(!voiceOn() || !this.supported()) return;
    try{
      applyAudio();
      if(!this.ctx){
        var C=window.AudioContext || window.webkitAudioContext, lim;
        this.ctx=new C(); this.out=this.ctx.createGain(); lim=this.ctx.createDynamicsCompressor();
        lim.threshold.value=-3; lim.knee.value=0; lim.ratio.value=20; lim.attack.value=0.002; lim.release.value=0.1;
        this.out.connect(lim); lim.connect(this.ctx.destination);

      if(this.ctx.state!=='running' && this.ctx.resume){ var p=this.ctx.resume(); if(p && p.catch) p.catch(function(){}); }
    }catch(e){}
  },
  reset:function(){ this.stop(); this.index=null; this.indexDir=null; this.indexP=null; this.packs={}; this.bufs={}; },
  loadIndex:function(){
    var self=this, d=this.dir();
    if(this.index && this.indexDir===d) return Promise.resolve(this.index);
    if(this.indexP && this.indexDir===d) return this.indexP;
    this.indexDir=d; this.index=null;
    this.indexP=fetch(d+'index.json').then(function(r){ if(!r.ok) throw new Error('index'); return r.json(); }).then(function(j){ if(self.indexDir===d) self.index=j; return j; });
    this.indexP.catch(function(){ if(self.indexDir===d) self.indexP=null; });
    return this.indexP;
  },
  loadPack:function(pack){
    var self=this, k=this.dir()+pack;
    if(this.packs[k]) return this.packs[k];
    var p=fetch(k+'.mp3').then(function(r){ if(!r.ok) throw new Error('paquet'); return r.arrayBuffer(); });
    p.catch(function(){ delete self.packs[k]; });
    return (this.packs[k]=p);
  },
  buffer:function(pack, clip){
    var self=this, k=this.dir()+pack+':'+clip;
    if(this.bufs[k]) return Promise.resolve(this.bufs[k]);

      var o=r[0][pack] && r[0][pack][clip];
      if(!o || !self.ctx) throw new Error('extrait');
      var part=r[1].slice(o[0], o[1]);

    }).then(function(b){ self.bufs[k]=b; return b; });
  },
  preload:function(packs){

    packs.forEach(function(p){ self.loadPack(p).catch(function(){}); });
  },
  /* say([['coach','go1'],['presse','n']]) dit les extraits à la suite. Avec suite=true, attend la fin de la phrase en cours. */
  say:function(list, suite){
    var self=this;
    if(!list || !list.length) return;
    this.log.push(list.map(function(x){ return x[0]+':'+x[1]; }).join(' ')); if(this.log.length>80) this.log.shift();

    this.tail=(this.tail || Promise.resolve()).then(function(){
      return Promise.all(list.map(function(x){ return self.buffer(x[0], x[1]).catch(function(){ return null; }); }));
    }).then(function(bufs){

  pump:function(){

      var done=function(){ if(self.src===s){ self.src=null; self.pump(); } };
      s.onended=done; this.src=s; s.start();
      setTimeout(done, s.buffer.duration*1000+1500);          // garde-fou si le téléphone a suspendu le son
    }catch(e){ this.src=null; }
  },
  stop:function(){ this.gen++; this.queue=[]; var s=this.src; this.src=null; try{ if(s){ s.onended=null; s.stop(); } }catch(e){} }
};

/* ---------- Contexte de l'exercice en cours ---------- */
function ctxOf(){
  var cur=S.cur, it=curItem(cur), ex=EXI[it.exId];
  var rec=recommend(S, ex, it.tg, it.light, cur.start), adv=setAdvice(S, ex, rec, it.sets);
  var k=it.key+'#'+it.exId+'#'+it.sets.length+'#'+(it.light?1:0);
  if(!cur.input || cur.input.key!==k) cur.input={key:k, w:adv.w, r:adv.r, rir:null};
  ui.stepW=incOf(S, ex);
  var n=it.sets.length, goal=(rec.per[n] && adv.w===rec.w) ? rec.per[n] : null;
  return {cur:cur, it:it, ex:ex, rec:rec, adv:adv, goal:goal};
}
/* ---------- Coach : quoi dire et quand ----------
   Normalement : signal de reprise, un conseil sur l'exercice aux deux premières séries, un encouragement par série.
   Peu : signal de reprise, un conseil par exercice, un encouragement sur la dernière série. Jamais de chiffres : ils sont à l'écran. */
function pickLine(key){
  var n=COACH[key].length, i;
  if(n<2) return key+'0';
  S.lines=S.lines||{}; i=Math.floor(Math.random()*n);
  if(i===S.lines[key]) i=(i+1)%n;
  S.lines[key]=i; return key+i;
}
var Coach={
  quiet:function(){ return S.settings.talk==='peu'; },
  clear:function(){ var c=S.cur; if(c){ c.tipAt=null; c.encAt=null; c.tip=null; } },
  tipFor:function(c, n){
    if(c.it.light) return n===0 ? ['coach','light0'] : null;
    if(n===0) return [c.ex.id, (this.quiet() && exHistory(S,c.ex.id).length%2) ? 't2' : 't1'];
    if(n===1 && !this.quiet()) return [c.ex.id,'t2'];
    return null;
  },
  /* Nom de l'exercice, suivi du conseil si la série peut commencer tout de suite */
  intro:function(lead, withTip){
    if(!S.cur) return;
    var c=ctxOf(), n=c.it.sets.length, a=[], tip=withTip ? this.tipFor(c,n) : null;
    this.clear();
    if(lead) a.push(['coach',lead]);
    a.push([c.ex.id,'n']);
    if(tip){ a.push(tip); c.cur.tipKey=c.it.key+'#'+c.ex.id+'#'+n; }
    Snd.preload([c.ex.id]); Snd.say(a);
  },
  /* Fin du repos : signal, puis conseil et encouragement programmés pendant la série */
  go:function(manual){
    if(!S.cur) return;
    var c=ctxOf(), cur=c.cur, n=c.it.sets.length, t=now(), last=(c.it.tg.sets>1 && n===c.it.tg.sets-1);
    this.clear();
    if(!manual) Snd.say([['coach', pickLine(last?'last':'go')]]);
    var key=c.it.key+'#'+c.ex.id+'#'+n, tip=(cur.tipKey===key) ? null : this.tipFor(c,n);

  },
  /* Série validée : un mot si l'objectif est atteint, et le nom de l'exercice suivant */
  setDone:function(reached, nextEx, back){

    if(nextEx){ Snd.preload([nextEx.id]); if(!this.quiet()){ a.push(['coach', back?'back0':'next0']); a.push([nextEx.id,'n']); } }

  },
  tick:function(t){

  }
};

function vWorkout(){

  html+='<header class="wtop"><button class="btn sm" data-act="quit">Quitter</button><div class="mid"><b>'+h(cur.name)+'</b><span id="chrono">'+fmtDur((t-cur.start)/1000)+'</span></div><button class="btn sm" data-act="finish">Terminer</button></header>';
  html+='<div class="segs">'+cur.order.map(function(i){ var x=cur.items[i]; return '<i class="'+(x===it?'cur':x.state==='done'?'done':x.state==='skip'?'skip':'')+'"></i>'; }).join('')+'</div>';
  if(it.deferred===1 && !n){
    html+='<div class="banner"><div>On revient sur <b>'+h(ex.n)+'</b>. La machine est libre ?</div><div class="row"><button class="btn dark grow" data-act="ackfree">Oui, on y va</button><button class="btn grow" data-act="busy">Toujours occupée</button></div></div>';
  }
  html+='<button class="demo" id="demo" data-act="demo" aria-label="Démonstration de l’exercice : mettre en pause ou relancer"><span class="ph" style="background-image:url(\'img/'+ex.id+'.jpg\')"></span><span class="lbl">Départ ↔ arrivée</span></button>';
  html+='<div><h1 class="exname">'+h(ex.n)+'</h1><div class="chips" style="margin-top:8px"><span class="pill solid">'+MUSCLES[ex.m]+'</span><span class="pill">'+EQ[ex.eq]+'</span>'+(it.light?'<span class="pill warn">Version douce</span>':'')+'</div></div>';
  itemNotes(cur,it).forEach(function(x){ html+='<p class="note">'+h(x)+'</p>'; });

  var isFirst=(rec.kind==='first' && !n), goal=c.goal ? String(c.goal) : rec.lo+'–'+rec.hi;
  html+='<section class="plate"><div class="eyebrow">'+(isFirst?'Charge de départ':'Charge conseillée')+' · série '+(n+1)+' sur '+it.tg.sets+'</div>';
  if(ex.bw && !(c.adv.w>0)) html+='<div class="load txt">Poids du corps</div>';
  else html+='<div class="load num">'+(ex.bw?'+ ':'')+fmtKg(c.adv.w)+'<small>kg</small></div>';
  html+='<div class="unit">'+h(unitOf(ex))+'</div><div class="side"><b>'+goal+'</b><span>répétitions'+(c.goal?' visées':'')+'</span><span>'+(it.light?'sans forcer':'1–2 en réserve')+'</span></div></section>';
  var why=c.adv.note || rec.msg;
  if(n && !c.adv.note) why=(c.goal && rec.last && rec.last.R[n]!=null) ? 'Même charge. Sur cette série la dernière fois : '+rec.last.R[n]+' répétitions. Vise '+c.goal+'.'
                                  : 'Même charge. Reste entre '+rec.lo+' et '+rec.hi+' répétitions, avec 1 ou 2 en réserve.';
  html+='<p class="why">'+h(why)+'</p>';
  if(rec.plateau && !n) html+='<p class="note">Pas de progrès sur cet exercice depuis 3 séances. Termine chaque série à 1 ou 2 répétitions de l’échec et ajoute une série aujourd’hui.</p>';
  if(!n){ var wu=warmups(S, ex, c.adv.w); if(wu.length && !isFirst) html+='<p class="small muted">Montée en charge avant la première série : '+wu.map(function(x){ return fmtKg(x.w)+' kg × '+x.r; }).join(', puis ')+'.</p>'; }
  if(n) html+='<div class="chips">'+it.sets.map(function(s,i){ return '<button class="setchip" data-act="editset" data-i="'+i+'">S'+(i+1)+' · '+(ex.bw?(s.w>0?'+'+fmtKg(s.w)+' kg':'PC'):fmtKg(s.w)+' kg')+' × '+s.r+(s.rir!=null?' · R'+(s.rir>=3?'3+':s.rir):'')+'</button>'; }).join('')+'</div>';

  if(cur.rest){
    var left=Math.max(0,(cur.rest.end-t)/1000);
    html+='<section class="rest"><div class="eyebrow">Repos</div><div class="t" id="rest-time">'+fmtDur(Math.ceil(left))+'</div><div class="bar"><i id="rest-bar" style="width:'+Math.max(0,Math.min(100,100*(1-left/cur.rest.total)))+'%"></i></div>'
      +'<div class="row"><button class="btn grow" data-act="restadj" data-d="-15">− 15 s</button><button class="btn grow" data-act="restadj" data-d="15">+ 15 s</button></div>'
      +'<button class="btn primary block" data-act="restskip">Reprendre maintenant</button>'
      +'</section>';
  } else {
    html+='<div class="inputs"><div class="stp"><label for="in-w">'+(ex.bw?'Lest (kg)':'Charge (kg)')+'</label><div><button data-act="step" data-k="w" data-d="-1" aria-label="Moins de charge">−</button><input id="in-w" inputmode="decimal" autocomplete="off" value="'+fmtKg(cur.input.w)+'"><button data-act="step" data-k="w" data-d="1" aria-label="Plus de charge">+</button></div></div>'
      +'<div class="stp"><label for="in-r">Répétitions faites</label><div><button data-act="step" data-k="r" data-d="-1" aria-label="Moins de répétitions">−</button><input id="in-r" inputmode="numeric" autocomplete="off" value="'+cur.input.r+'"><button data-act="step" data-k="r" data-d="1" aria-label="Plus de répétitions">+</button></div></div></div>'
      +'<div class="field"><span>Répétitions encore possibles à la fin</span><div class="seg" id="rir">'+[0,1,2,3].map(function(v){ return '<button data-act="rir" data-v="'+v+'" class="'+(cur.input.rir===v?'on':'')+'">'+(v===3?'3 ou +':v)+'</button>'; }).join('')+'</div></div>'
      +'<button class="btn primary block" data-act="logset">Série terminée</button>'
      +'<button class="link small" data-act="stepsize">Pas de charge : '+fmtKg(ui.stepW)+' kg. Changer</button>';
  }
  html+='<section class="card"><div class="eyebrow">Comment faire</div><ol class="cues">'+ex.cues.map(function(x){ return '<li>'+h(x)+'</li>'; }).join('')+'</ol></section>';
  html+='<div class="acts">'
    +(n ? '' : '<button class="btn" data-act="busy">Machine occupée</button><button class="btn" data-act="absent">Pas dans ma salle</button>')
    +'<button class="btn" data-act="pain">J’ai mal</button><button class="btn" data-act="alt">Autre exercice</button>'
    +'<button class="btn" data-act="addset">+ 1 série</button><button class="btn" data-act="skip">'+(n?'Arrêter cet exercice':'Passer')+'</button></div>';
  var q=cur.order.filter(function(i,p){ return p!==cur.pos && cur.items[i].state==='todo'; });
  if(q.length){
    html+='<section class="card"><div class="eyebrow">Ensuite</div><ul class="queue">'+q.map(function(i){ var x=cur.items[i], e=EXI[x.exId]; return '<li><button data-act="jump" data-i="'+i+'"><span>'+h(e.n)+(x.deferred===1?' <span class="pill">en attente</span>':'')+'</span><span class="d num">'+(x.sets.length?x.sets.length+' / ':'')+x.tg.sets+' × '+(x.light?'15–20':x.tg.lo+'–'+x.tg.hi)+'</span></button></li>'; }).join('')+'</ul></section>';
  }
  html+='<button class="link small" data-act="voicetoggle">Voix du coach : '+(S.settings.voice?(!Snd.supported()?'indisponible sur cet appareil':voiceOn()?'activée':'muette ici'):'coupée')+'. Changer</button>';
  return html;
}

function vReport(){
  var se=null; S.sessions.forEach(function(s){ if(s.id===ui.reportId) se=s; });
  if(!se){ view='progress'; return vProgress(); }
  var rep=buildReport(S,se), isLast=S.sessions[S.sessions.length-1]===se, html='';
  html+='<header class="brand"><b>Rapport de séance</b><span>'+h(cap(fmtDate(se.start,true)))+'</span></header>';
  html+='<section class="card"><div class="eyebrow">'+h(se.name)+' · '+fmtTime(se.start)+'–'+fmtTime(se.end)+'</div><h1 class="title">'+h(rep.verdict)+'</h1>'
    +'<div class="tiles"><div class="tile"><b>'+rep.durMin+'</b><span>minute'+(rep.durMin>1?'s':'')+'</span></div><div class="tile"><b>'+rep.nSets+'</b><span>séries</span></div><div class="tile"><b>'+rep.nReps+'</b><span>répétitions</span></div>'
    +'<div class="tile"><b>'+rep.ton+'</b><span>kg soulevés</span></div><div class="tile"><b>'+(rep.cmp ? rep.up+' / '+rep.cmp : '–')+'</b><span>en hausse</span></div><div class="tile"><b>'+rep.prs+'</b><span>record'+(rep.prs>1?'s':'')+'</span></div></div>'
    +'<ul class="list">'+rep.comments.map(function(x){ return '<li>'+h(x)+'</li>'; }).join('')+'</ul></section>';
  html+='<section class="card"><div class="eyebrow">Exercice par exercice</div><div>';
  rep.rows.forEach(function(r){
    if(!r.sets.length) return;
    var p=r.status==='up'?'<span class="pill good">▲ '+(r.delta>=0?'+':'')+fmtKg(Math.round(r.delta*10)/10)+' %</span>':r.status==='down'?'<span class="pill bad">▼ '+fmtKg(Math.round(r.delta*10)/10)+' %</span>':r.status==='same'?'<span class="pill">= stable</span>':'<span class="pill">référence</span>';
    html+='<div class="rrow"><div class="hd"><b>'+h(r.name)+(r.light?' <span class="pill warn">doux</span>':'')+'</b><span class="row">'+(r.pr?'<span class="pill solid">Record</span>':'')+p+'</span></div>'
      +'<div class="sets">'+r.sets.map(function(s){ return h(setLabel(r,s)); }).join(' · ')+'</div>'
      +(r.prev?'<div class="sets">Fois précédente, meilleure série : '+h(setLabel(r,r.prev))+'</div>':'')+'</div>';
  });
  html+='</div>'+(rep.skipped.length?'<p class="small muted">Non faits : '+h(rep.skipped.join(', '))+'.</p>':'')+'</section>';
  html+='<section class="card"><div class="eyebrow">Volume de la semaine après cette séance</div>'+volBlock(rep.week, plannedWeek(S))+'<p class="small muted">Séries par muscle : faites / prévues. Trait jaune : 10 séries.</p></section>';
  if(isLast && !S.cur) html+='<section class="card"><div class="eyebrow">Prochaine séance</div><h2 class="h2">'+h(TPL[todayTpl(S)].n)+'</h2><p class="small muted">Laisse au moins 48 heures avant de retravailler les mêmes muscles.</p></section>';
  html+='<button class="btn dark block" data-act="copyreport">Copier le rapport</button><button class="btn block" data-act="tab" data-v="home">Retour à l’accueil</button><button class="link small" data-act="delsession">Supprimer cette séance</button>';
  return html;
}

function chartSvg(pts){
  var W=320, H=150, L=38, R=12, T=12, B=24, min=Infinity, max=-Infinity, i;
  pts.forEach(function(p){ min=Math.min(min,p.v); max=Math.max(max,p.v); });
  if(max-min<1){ max+=1; min-=1; }
  var pad=(max-min)*0.12; min-=pad; max+=pad;
  function x(k){ return pts.length===1 ? (L+(W-R))/2 : L+(W-L-R)*k/(pts.length-1); }
  function y(v){ return T+(H-T-B)*(1-(v-min)/(max-min)); }
  var d='', area='';
  for(i=0;i<pts.length;i++){ d+=(i?'L':'M')+x(i).toFixed(1)+' '+y(pts[i].v).toFixed(1); }
  area=d+'L'+x(pts.length-1).toFixed(1)+' '+(H-B)+'L'+x(0).toFixed(1)+' '+(H-B)+'Z';
  var lo=pts.reduce(function(a,p){ return Math.min(a,p.v); },Infinity), hi=pts.reduce(function(a,p){ return Math.max(a,p.v); },-Infinity), lastP=pts[pts.length-1];
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Évolution du 1RM estimé">';
  s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(hi).toFixed(1)+'" y2="'+y(hi).toFixed(1)+'" stroke="var(--line)" stroke-dasharray="3 4"/>';
  if(hi-lo>=1) s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(lo).toFixed(1)+'" y2="'+y(lo).toFixed(1)+'" stroke="var(--line)" stroke-dasharray="3 4"/>';
  s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+(H-B)+'" y2="'+(H-B)+'" stroke="var(--line)"/>';
  if(pts.length>1) s+='<path d="'+area+'" fill="var(--accent)" opacity=".22"/><path d="'+d+'" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>';
  for(i=0;i<pts.length-1;i++) s+='<circle cx="'+x(i).toFixed(1)+'" cy="'+y(pts[i].v).toFixed(1)+'" r="2.5" fill="var(--ink)"/>';
  s+='<circle cx="'+x(pts.length-1).toFixed(1)+'" cy="'+y(lastP.v).toFixed(1)+'" r="5" fill="var(--accent)" stroke="var(--ink)" stroke-width="2"/>';
  s+='<text x="'+(L-6)+'" y="'+(y(hi)+4).toFixed(1)+'" text-anchor="end">'+Math.round(hi)+'</text>';
  if(hi-lo>=1) s+='<text x="'+(L-6)+'" y="'+(y(lo)+4).toFixed(1)+'" text-anchor="end">'+Math.round(lo)+'</text>';
  s+='<text x="'+L+'" y="'+(H-7)+'">'+h(fmtDate(pts[0].t))+'</text>';
  if(pts.length>1) s+='<text x="'+(W-R)+'" y="'+(H-7)+'" text-anchor="end">'+h(fmtDate(lastP.t))+'</text>';
  return s+'</svg>';
}
function vProgress(){
  var html='<header class="brand"><b>Progrès</b><span>'+plural(S.sessions.length,'séance')+' enregistrée'+(S.sessions.length>1?'s':'')+'</span></header>';
  var withH=EX.filter(function(e){ return exHistory(S,e.id).some(function(x){ return !x.light; }); });
  if(!S.sessions.length){
    return html+'<section class="card"><h2 class="h2">Rien à afficher pour l’instant</h2><p>Termine ta première séance. Tu verras ici ton historique, tes records et la courbe de chaque exercice.</p><button class="btn dark" data-act="tab" data-v="home">Voir la séance du jour</button></section>';
  }
  if(withH.length){
    if(!ui.histEx || !EXI[ui.histEx] || withH.indexOf(EXI[ui.histEx])<0){
      var lastS=S.sessions[S.sessions.length-1], f=lastS.items.filter(function(it){ return it.sets.length && !it.light; })[0];
      ui.histEx=(f && EXI[f.exId]) ? f.exId : withH[0].id;
    }
    var ex=EXI[ui.histEx], H=exHistory(S,ex.id).filter(function(x){ return !x.light; });
    var pts=H.map(function(e){ return {t:e.t, v:bestSet(S,ex,e.sets).e1}; }), first=pts[0].v, lastV=pts[pts.length-1].v, dl=(lastV/first-1)*100;
    html+='<section class="card"><div class="eyebrow">Progression par exercice</div>'
      +'<select id="hist-ex" data-bind="histex" aria-label="Exercice">'+withH.map(function(e){ return '<option value="'+e.id+'"'+(e.id===ex.id?' selected':'')+'>'+h(e.n)+'</option>'; }).join('')+'</select>'
      +'<div class="row wrap"><span class="h2 num">'+fmtKg(Math.round(lastV*10)/10)+' kg</span>'+(pts.length>1?'<span class="pill '+(dl>=1?'good':dl<=-1?'bad':'')+'">'+(dl>=0?'+':'')+fmtKg(Math.round(dl*10)/10)+' % depuis le début</span>':'')+'</div>'
      +chartSvg(pts)
      +'<p class="small muted">Force maximale estimée sur une répétition (1RM, formule d’Epley)'+(ex.bw?', poids du corps compris':'')+'. Meilleure série de chaque séance.</p><div>';
    H.slice(-5).reverse().forEach(function(e){ html+='<div class="set-row small"><span>'+h(cap(fmtDate(e.t)))+'</span><span class="num muted">'+e.sets.map(function(s){ return (ex.bw?(s.w>0?'+'+fmtKg(s.w):'PC'):fmtKg(s.w))+' × '+s.r; }).join(' · ')+'</span></div>'; });
    html+='</div></section>';
  }
  html+='<section class="card"><div class="eyebrow">Séances</div><div>';
  S.sessions.slice().reverse().slice(0,40).forEach(function(se){
    var rp=buildReport(S,se);
    html+='<button class="sess" data-act="report" data-id="'+h(se.id)+'"><span><b>'+h(se.name)+'</b><small>'+h(cap(fmtDate(se.start,true)))+' · '+rp.nSets+' séries · '+rp.ton+' kg'+(rp.prs?' · '+plural(rp.prs,'record'):'')+'</small></span><span class="pill '+(rp.up>rp.down?'good':rp.down>rp.up?'bad':'')+'">'+h(rp.verdict.replace('Séance ',''))+'</span></button>';
  });
  return html+'</div></section>';
}

      : (ui.storeOk ? (inClaude() ? 'Sauvegarde : sur cet appareil seulement pour l’instant.' : 'Sauvegarde : sur cet appareil. Touche « Copier mes données » de temps en temps pour garder une copie ailleurs.')
                    : 'Sauvegarde impossible sur cet appareil : les données seront perdues à la fermeture. Copie-les ci-dessous.'))+'</p>'
    +'<button class="btn" data-act="export">Copier mes données</button><button class="btn" data-act="importopen">Importer des données</button><button class="btn danger" data-act="resetask">Tout effacer</button></section>';
  if(canInstall()) html+='<section class="card"><div class="eyebrow">Sur l’écran d’accueil</div><p class="small">Sur iPhone, ouvre cette page dans Safari, touche le bouton Partager, puis « Sur l’écran d’accueil ». L’application s’ouvre alors en plein écran et fonctionne sans réseau.</p></section>';
  return html+'<p class="small muted">Photos d’exercices : Free Exercise DB, domaine public.</p>';
}

function openSheet(n){ ui.sheet=n; renderSheet(); }
function closeSheet(){ ui.sheet=null; ui.msg=''; renderSheet(); }
function renderSheet(){
  var el=$('sheet');
  if(!ui.sheet || !SHEETS[ui.sheet]){ el.className=''; el.innerHTML=''; return; }
  el.className='on';
  el.innerHTML='<div class="bg" data-act="close"></div><div class="box" role="dialog" aria-modal="true">'+SHEETS[ui.sheet]()+'</div>';
}
function render(){
  if(view==='workout' && !S.cur) view='home';
  var root=$('app'), html;
  if(view==='workout') html=vWorkout();
  else html=(view==='progress'?vProgress():view==='science'?vScience():view==='settings'?vSettings():view==='report'?vReport():vHome())+vTabs();
  root.className='v-'+view; root.innerHTML=html;
  renderSheet();
}
function go(v){ view=v; render(); window.scrollTo(0,0); }

/* ---------- Déroulé ---------- */
function startRest(sec){
  var t=now();
  S.cur.rest={start:t, end:t+sec*1000, total:sec, ten:false};
}
function endRest(manual){
  var cur=S.cur; if(!cur || !cur.rest) return;
  cur.rest=null;
  saveLocal(); render();
  Coach.go(manual);
}
function doFinish(){
  var t=now(), se=finishSession(S, t);
  unwake(); closeSheet();
  if(!se){ save(); view='home'; render(); toast('Aucune série saisie : la séance n’a pas été enregistrée.'); Snd.stop(); return; }
  save('session', se);
  ui.reportId=se.id; view='report'; render(); window.scrollTo(0,0);
  Snd.say([['coach', pickLine('end')]]);
}
function afterChange(){
  var cur=S.cur;
  if(curItem(cur).state!=='todo'){ if(!advance(cur)){ doFinish(); return; } }
  cur.input=null; save(); render(); Coach.intro(null, !cur.rest);
}
function sessionPacks(cur){ return ['coach'].concat(cur.items.map(function(it){ return it.exId; })); }
function tick(){
  if(!S || !S.cur || view!=='workout') return;
  var cur=S.cur, t=now(), el=$('chrono');
  if(el) el.textContent=fmtDur((t-cur.start)/1000);
  if(cur.rest){
    var left=(cur.rest.end-t)/1000, rt=$('rest-time'), rb=$('rest-bar');
    if(rt) rt.textContent=fmtDur(Math.ceil(left));
    if(rb) rb.style.width=Math.max(0,Math.min(100,100*(1-left/cur.rest.total)))+'%';
    if(!cur.rest.ten && left<=10 && left>5 && cur.rest.total>=40){ cur.rest.ten=true; if(!Coach.quiet()) Snd.say([['coach','ten0']], true); }
    if(left<=0) endRest(false);
  } else Coach.tick(t);
}
function readInputs(){
  var cur=S.cur; if(!cur || !cur.input) return;
  var a=$('in-w'), b=$('in-r'), w, r;
  if(a){ w=parseNum(a.value); if(w!=null && w>=0) cur.input.w=r2(w); }
  if(b){ r=parseNum(b.value); if(r!=null && r>=0) cur.input.r=Math.round(r); }
}
function readEdit(){
  var a=$('ed-w'), b=$('ed-r'), w, r; if(!ui.edit) return;
  if(a){ w=parseNum(a.value); if(w!=null && w>=0) ui.edit.w=r2(w); }
  if(b){ r=parseNum(b.value); if(r!=null && r>=0) ui.edit.r=Math.round(r); }
}

/* ---------- Actions ---------- */
var ACT={
  tab:function(d){ go(d.v); },
  close:function(){ closeSheet(); },
  start:function(){
    var cur=buildSession(S, todayTpl(S), now());
    if(!remaining(cur)){ toast('Aucun exercice possible avec les réglages actuels. Vérifie les zones sensibles et les machines absentes.'); return; }
    S.cur=cur; view='workout'; wake(); Snd.unlock(); preload(cur); Snd.preload(sessionPacks(cur));
    save(); render(); window.scrollTo(0,0);
    Coach.intro('start0', true);
    if(S.settings.voice && !voiceOn()) toast('Coach muet ici : dans ce navigateur, l’iPhone couperait ta musique. Ouvre l’application depuis son icône sur l’écran d’accueil.', 8000);
  },
  resume:function(){ view='workout'; wake(); Snd.unlock(); preload(S.cur); Snd.preload(sessionPacks(S.cur)); render(); window.scrollTo(0,0); },
  pick:function(){ openSheet('pick'); },
  pickset:function(d){ S.rot=+d.i; closeSheet(); save(); render(); },
  report:function(d){ ui.reportId=d.id; go('report'); },
  demo:function(d, el){ el.classList.toggle('paused'); },
  step:function(d){
    var edit=(d.s==='edit'), o=edit ? ui.edit : S.cur.input, dir=+d.d;
    if(edit) readEdit();
    if(d.k==='w'){ o.w=Math.max(0, r2(o.w+dir*ui.stepW)); var a=$(edit?'ed-w':'in-w'); if(a) a.value=fmtKg(o.w); }
    else { o.r=Math.max(0, o.r+dir); var b=$(edit?'ed-r':'in-r'); if(b) b.value=o.r; }
    if(!edit) saveLocal();
  },
  rir:function(d){
    var v=+d.v, inp=S.cur.input; inp.rir=(inp.rir===v)?null:v;
    var bs=$('rir').querySelectorAll('button'), i; for(i=0;i<bs.length;i++) bs[i].className=(+bs[i].getAttribute('data-v')===inp.rir)?'on':'';
  },
  logset:function(){
    var c=ctxOf(), cur=c.cur, inp=cur.input;
    if(!(inp.r>0)){ toast('Indique le nombre de répétitions faites.'); return; }
    var reached=c.goal ? inp.r>=c.goal : inp.r>=c.rec.hi;
    var res=logSet(S, {w:inp.w, r:inp.r, rir:inp.rir}, now()), sec=c.it.light ? Math.min(90, restFor(S,c.ex)) : restFor(S,c.ex);
    if(res.finished && !advance(cur)){ doFinish(); return; }
    cur.input=null; startRest(sec);
    Coach.setDone(reached, res.finished ? EXI[curItem(cur).exId] : null, res.finished && curItem(cur).deferred===1);
    save(); render();
    if(res.finished) window.scrollTo(0,0);
  },
  restadj:function(d){ var r=S.cur.rest; if(!r) return; r.end+=(+d.d)*1000; r.total=Math.max(15, r.total+(+d.d)); if(r.end<now()) r.end=now(); saveLocal(); tick(); },
  restskip:function(){ endRest(true); },
  stepsize:function(){ openSheet('stepsize'); },
  stepset:function(d){ var ex=EXI[curItem(S.cur).exId]; S.incs[ex.id]=+d.v; closeSheet(); S.cur.input=null; save(); render(); },
  editset:function(d){ var it=curItem(S.cur), s=it.sets[+d.i]; if(!s) return; ui.edit={i:+d.i, w:s.w, r:s.r}; openSheet('editset'); },
  editsave:function(){ readEdit(); var it=curItem(S.cur), s=it.sets[ui.edit.i]; if(s){ s.w=ui.edit.w; s.r=ui.edit.r; } closeSheet(); S.cur.input=null; save(); render(); },
  editdel:function(){ var it=curItem(S.cur); it.sets.splice(ui.edit.i,1); closeSheet(); S.cur.input=null; save(); render(); },
  ackfree:function(){ curItem(S.cur).deferred=2; save(); render(); },
  busy:function(){
    var r=actBusy(S);
    if(r.type==='defer'){ toast('OK. On fait d’abord « '+EXI[r.next.exId].n+' ». Je te repropose « '+EXI[r.it.exId].n+' » juste après.', 6000); afterChange(); }
    else if(r.type==='replace'){ toast('Remplacé pour aujourd’hui par « '+r.ex.n+' ». « '+r.old.n+' » reste dans ton programme.', 6000); afterChange(); }
    else { toast('Pas d’autre exercice libre pour ce muscle. On passe au suivant.', 5000); afterChange(); }
  },
  absent:function(){
    var r=actAbsent(S), mine=r.changes.filter(function(x){ return x.current; })[0];
    if(mine && mine.ex) toast('Noté : « '+r.old.n+' » ne sera plus proposé. À la place : « '+mine.ex.n+' ».', 6000);
    else toast('Noté. Aucun autre exercice disponible pour ce muscle : on passe au suivant.', 6000);
    afterChange();
  },
  pain:function(){ ui.painDraft=clone(S.pain||{}); openSheet('pain'); },
  painset:function(d){ ui.painDraft[d.z]=+d.v; renderSheet(); },
  painok:function(){
    var p={}, z; for(z in ui.painDraft) if(ui.painDraft[z]>0) p[z]=ui.painDraft[z];
    closeSheet();
    if(!S.cur){ S.pain=p; save(); render(); toast(hasPain(p) ? 'Noté. Les séances sont adaptées tant que la zone reste signalée.' : 'Aucune zone sensible : programme normal.'); return; }
    var ch=actPain(S,p), sw=0, li=0, sk=0;
    ch.forEach(function(x){ if(x.type==='swap') sw++; else if(x.type==='light') li++; else sk++; });
    var parts=[]; if(sw) parts.push(plural(sw,'exercice')+' remplacé'+(sw>1?'s':'')); if(li) parts.push(li+' allégé'+(li>1?'s':'')); if(sk) parts.push(sk+' écarté'+(sk>1?'s':''));
    toast(parts.length ? 'Séance adaptée : '+parts.join(', ')+'.' : (hasPain(p) ? 'Noté. Aucun exercice restant ne charge cette zone.' : 'Programme normal rétabli.'), 6000);
    afterChange();
  },
  alt:function(){ ui.keep=true; openSheet('alt'); },
  altkeep:function(d){ ui.keep=(+d.v===1); renderSheet(); },
  altpick:function(d){ var ex=actChoose(S, d.id, ui.keep); closeSheet(); toast('Exercice choisi : « '+ex.n+' »'+(ui.keep?', gardé pour les prochaines séances.':', pour aujourd’hui.')); afterChange(); },
  addset:function(){ var it=curItem(S.cur); if(it.tg.sets>=8) return; it.tg.sets++; save(); render(); toast('Une série ajoutée : '+it.tg.sets+' au total.'); },
  skip:function(){ actSkip(S); afterChange(); },
  jump:function(d){ var cur=S.cur, p=cur.order.indexOf(+d.i); if(p<0) return; cur.pos=p; cur.rest=null; cur.input=null; save(); render(); window.scrollTo(0,0); Coach.intro(null, true); },
  voicetoggle:function(){ S.settings.voice=!S.settings.voice; if(voiceOn()){ Snd.unlock(); Snd.preload(sessionPacks(S.cur)); Snd.say([['coach','test0']]); } else Snd.stop(); save(); render(); },
  quit:function(){ openSheet('quit'); },
  pause:function(){ closeSheet(); unwake(); Snd.stop(); go('home'); },
  finish:function(){ if(remaining(S.cur)>0) openSheet('finish'); else doFinish(); },
  finishnow:function(){ doFinish(); },
  abandon:function(){ S.cur=null; closeSheet(); unwake(); Snd.stop(); save(); go('home'); toast('Séance abandonnée. Rien n’a été enregistré.'); },
  copyreport:function(){
    var se=null; S.sessions.forEach(function(s){ if(s.id===ui.reportId) se=s; }); if(!se) return;
    var isLast=S.sessions[S.sessions.length-1]===se;
    copyText(reportText(buildReport(S,se), isLast?TPL[todayTpl(S)].n:null), 'Rapport copié.', 'Rapport de séance');
  },
  delsession:function(){ ui.confirm={title:'Supprimer cette séance ?', text:'Ses séries ne compteront plus dans tes progrès ni dans les charges conseillées.', yes:'Supprimer', fn:function(){
    var id=ui.reportId; S.sessions=S.sessions.filter(function(s){ return s.id!==id; }); S.deleted[id]=1; save('delete', id); go('progress'); toast('Séance supprimée.'); }}; openSheet('confirm'); },
  confirmyes:function(){ var f=ui.confirm && ui.confirm.fn; closeSheet(); if(f) f(); },
  setdays:function(d){ S.profile.days=+d.v; S.rot=0; save(); render(); },
  setdur:function(d){ S.profile.dur=+d.v; save(); render(); },
  setrest:function(d){ S.settings[d.k]=Math.max(30, Math.min(300, (S.settings[d.k]||90)+(+d.d))); save(); render(); },
  setvoice:function(d){ S.settings.voice=(+d.v===1); if(S.settings.voice) Snd.unlock(); else Snd.stop(); save(); render(); },
  setforce:function(d){ S.settings.force=(+d.v===1); if(!voiceOn()) Snd.stop(); save(); render(); },

  setvol:function(d){ S.settings.vol=+d.v; save(); render(); ACT.testvoice(); },
  testvoice:function(){
    if(!Snd.supported()){ toast('Ce navigateur ne peut pas lire la voix du coach.'); return; }
    if(!S.settings.voice){ toast('La voix est coupée. Active-la d’abord.'); return; }
    if(!voiceOn()){ toast('Ici, le coach reste muet pour ne pas couper ta musique. Ouvre l’application depuis son icône, ou choisis « Parle quand même ».', 7000); return; }
    Snd.unlock(); Snd.preload(['coach']); Snd.say([['coach','test0']]);
  },
  restore:function(d){ delete S.unavail[d.k]; save(); render(); toast('Exercice remis dans le programme.'); },
  export:function(){ copyText(JSON.stringify(S), 'Données copiées. Colle-les dans une note pour les garder.', 'Mes données'); },
  importopen:function(){ ui.msg=''; openSheet('importer'); },
  importgo:function(){
    var el=$('imp'), o=null;
    try{ o=JSON.parse(el.value); }catch(e){ o=null; }
    if(!o || o.v!==1 || !Array.isArray(o.sessions)){ ui.msg='Texte non reconnu. Colle le texte complet obtenu avec « Copier mes données ».'; renderSheet(); return; }
    S=normalize(o); S.cur=null; closeSheet(); save();
    S.sessions.forEach(function(se){ Sync.push('session', se); });

function copyText(txt, okMsg, title){
  function fallback(){ ui.textOut=txt; ui.textTitle=title; openSheet('text'); }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function(){ toast(okMsg); }, fallback);
    else fallback();
  }catch(e){ fallback(); }
}

document.addEventListener('click', function(e){
  var el=e.target.closest ? e.target.closest('[data-act]') : null;
  if(!el || el.disabled) return;
  var a=el.getAttribute('data-act');
  if(view==='workout'){ Snd.unlock(); if(!ui.sheet && a!=='step') readInputs(); }
  if(ACT[a]) ACT[a](el.dataset, el, e);
});
document.addEventListener('change', function(e){
  var el=e.target, b=el.getAttribute && el.getAttribute('data-bind');
  if(el.id==='in-w' || el.id==='in-r'){ readInputs(); saveLocal(); return; }
  if(b==='histex'){ ui.histEx=el.value; render(); }
  if(b==='bw'){ var v=parseNum(el.value); S.profile.bw=(v && v>=30 && v<=250) ? r2(v) : null; save(); render(); }
});
document.addEventListener('focusin', function(e){ var el=e.target; if(el && el.tagName==='INPUT' && el.select && /^(in-|ed-)/.test(el.id)){ try{ el.select(); }catch(x){} } });
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible'){ if(S && S.cur && view==='workout') wake(); tick(); } });

/* ---------- Version autonome (hors de Claude) : installation et hors connexion ---------- */
function inClaude(){ try{ return !!(window.claude && typeof window.claude.use==='function'); }catch(e){ return false; } }
function framed(){ try{ return window.self!==window.top; }catch(e){ return true; } }
function canInstall(){
  try{ return !inClaude() && !framed() && !(navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)); }
  catch(e){ return false; }
}
/* Garde les photos et la voix choisie sur le téléphone, pour la salle sans réseau. */
function warmCache(){
  try{
    if(!window.caches || framed() || inClaude()) return;
    var vox=(S.settings.vox==='m')?'m':'f', k='coach-cache', v=CACHE+':'+vox+':'+EX.length;
    try{ if(localStorage.getItem(k)===v) return; }catch(e){}
    window.caches.open(CACHE).then(function(c){
      var urls=EX.map(function(e){ return 'img/'+e.id+'.jpg'; })
        .concat(['snd/'+vox+'/index.json', 'snd/'+vox+'/coach.mp3'], EX.map(function(e){ return 'snd/'+vox+'/'+e.id+'.mp3'; })), i=0;
      (function next(){
        if(i>=urls.length){ try{ localStorage.setItem(k,v); }catch(e){} return; }
        var u=urls[i++];
        c.match(u).then(function(hit){ return hit || c.add(u); }).then(next, next);
      })();
    });
  }catch(e){}
}
function initOffline(){
  try{
    if(!('serviceWorker' in navigator) || framed() || inClaude()) return;
    if(location.protocol!=='https:' && location.hostname!=='localhost' && location.hostname!=='127.0.0.1') return;
    navigator.serviceWorker.register('sw.js').then(function(){
      try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
      warmCache();
    }).catch(function(){});
  }catch(e){}
}

/* ---------- Démarrage ---------- */
(function(){
  S=normalize(loadLocal());
  applyAudio();
  view='home';
  render();
  setInterval(tick, 500);
  Sync.init();
  initOffline();
})();

</script>
